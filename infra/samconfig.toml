# SAM CLI Configuration for Vision Emporium Loyalty System
# More information about the configuration file can be found here:
# https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/serverless-sam-cli-config.html

version = 0.1

[default.global.parameters]
stack_name = "ve-loyalty-system"
region = "ap-south-1"

[default.build.parameters]
cached = true
parallel = true

[default.deploy.parameters]
stack_name = "ve-loyalty-system"
region = "ap-south-1"
capabilities = "CAPABILITY_IAM CAPABILITY_NAMED_IAM"
confirm_changeset = true
resolve_s3 = true
parameter_overrides = "Environment=\"prod\" SyncIntervalMinutes=\"60\" FrontendBucketName=\"ve-loyalty-frontend\" UploadsBucketName=\"ve-loyalty-uploads\""
tags = "Project=VELoyalty Environment=prod"

[dev.deploy.parameters]
stack_name = "ve-loyalty-system-dev"
region = "ap-south-1"
capabilities = "CAPABILITY_IAM CAPABILITY_NAMED_IAM"
confirm_changeset = false
resolve_s3 = true
parameter_overrides = "Environment=\"dev\" SyncIntervalMinutes=\"60\" FrontendBucketName=\"ve-loyalty-frontend\" UploadsBucketName=\"ve-loyalty-uploads\""
tags = "Project=VELoyalty Environment=dev"

[staging.deploy.parameters]
stack_name = "ve-loyalty-system-staging"
region = "ap-south-1"
capabilities = "CAPABILITY_IAM CAPABILITY_NAMED_IAM"
confirm_changeset = true
resolve_s3 = true
parameter_overrides = "Environment=\"staging\" SyncIntervalMinutes=\"60\" FrontendBucketName=\"ve-loyalty-frontend\" UploadsBucketName=\"ve-loyalty-uploads\""
tags = "Project=VELoyalty Environment=staging"
